      const QuestionsStep = ({ value, onChange, onNext, template, role }) => {

          value.questions || template?.defaultQuestions || [
            "How do you orchestrate arrivals when multiple coaches arrive simultaneously?",
            "Describe your approach to resolving conflicting guest priorities during peak periods.",
            "What is your experience with Employment Hero workflows for onboarding?",
            "How do you coach team members to adopt new digital tools?",
          ]
        );

        const canEdit = role !== "Park Manager";

        const regenerate = () => {
          if (!canEdit) return;
          setQuestions([
            "Explain how you would transition a park from manual to digital check-in.",
            "Describe an example of leveraging guest feedback data to improve service.",
            "How do you ensure working rights compliance across seasonal staff?",
            "What metrics do you track weekly to assess reception performance?",

          onNext();

      const WeightsBiasesStep = ({ role, value, onChange, onNext, template }) => {
        const [weights, setWeights] = useState(
          value.weights || template?.defaultWeights || [

            { label: "Education", value: 20 },
            { label: "Communication", value: 10 },

        const templateBiases = template?.defaultBiases?.map((bias) => bias.label || bias) || [];
        const [biases, setBiases] = useState(value.biases || templateBiases);

        const totalWeight = weights.reduce((acc, item) => acc + Number(item.value || 0), 0);
        const canContinue = role !== "HRBP" || totalWeight === 100;

        const handleNext = () => {
          if (!canContinue) return;
          onChange({ weights, biases });
          onNext();
        };

        if (role !== "HRBP") {
          return (
            <Card
              title="Weights & Biases"
              description="Park Managers use the approved scoring model for this role family."
              actions={
                <button
                  className="rounded-xl bg-blue-500 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-400"
                  onClick={handleNext}
                >
                  Continue
                </button>
              }

              <p className="text-sm text-slate-600">

                    <p className="mt-2 text-2xl font-semibold text-slate-800">{weight.value}%</p>
                  </div>

              </div>

        return (
          <Card
            title="Configure Weights & Biases"
            description="Tune the scoring model for this analysis. Weights must total 100%."
            actions={
              <button
                className={`rounded-xl px-4 py-2 text-sm font-semibold text-white ${
                  canContinue ? "bg-blue-500 hover:bg-blue-400" : "bg-slate-400"

                onClick={handleNext}
              >
                Continue
              </button>
            }
          >
            <div className="grid gap-6 lg:grid-cols-2">
              <div className="space-y-4">
                <p className="text-xs uppercase tracking-wide text-slate-400">Weights (Total {totalWeight}%)</p>

                    <input
                      className="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm"
                      value={weight.label}
                      onChange={(event) => {
                        const updated = [...weights];
                        updated[index] = { ...weight, label: event.target.value };
                        setWeights(updated);
                      }}
                    />
                    <input
                      type="number"
                      className="w-24 rounded-lg border border-slate-200 px-3 py-2 text-sm"
                      value={weight.value}
                      onChange={(event) => {
                        const updated = [...weights];
                        updated[index] = { ...weight, value: Number(event.target.value) };
                        setWeights(updated);
                      }}
                    />
                    <button
                      className="text-xs font-semibold text-rose-500"
                      onClick={() => setWeights(weights.filter((_, i) => i !== index))}
                    >
                      Remove
                    </button>
                  </div>
                ))}
                <button
                  className="rounded-xl border border-dashed border-slate-300 px-4 py-2 text-sm font-semibold text-blue-600"
                  onClick={() => setWeights([...weights, { label: "New Factor", value: 0 }])}
                >
                  Add Weight
                </button>
              </div>
              <div className="space-y-4">
                <p className="text-xs uppercase tracking-wide text-slate-400">Bias Adjustments</p>
                {biases.map((bias, index) => (
                  <div key={index} className="flex items-center gap-2 rounded-2xl border border-slate-200 bg-white p-3">
                    <input
                      className="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm"
                      value={bias}
                      onChange={(event) => {
                        const updated = [...biases];
                        updated[index] = event.target.value;
                        setBiases(updated);
                      }}
                    />
                    <button
                      className="text-xs font-semibold text-rose-500"
                      onClick={() => setBiases(biases.filter((_, i) => i !== index))}
                    >
                      Remove
                    </button>
                  </div>
                ))}
                <button
                  className="rounded-xl border border-dashed border-slate-300 px-4 py-2 text-sm font-semibold text-blue-600"
                  onClick={() => setBiases([...biases, "+3 hospitality certifications"])}
                >
                  Add Bias
                </button>
              </div>
            </div>
          </Card>
        );

      const AnalysisProgress = ({ onComplete }) => {
        const [progress, setProgress] = useState(0);

        React.useEffect(() => {
          const interval = setInterval(() => {
            setProgress((prev) => {
              const next = Math.min(prev + 20, 100);
              if (next === 100) {
                clearInterval(interval);
                setTimeout(onComplete, 500);
              }
              return next;
            });
          }, 400);
          return () => clearInterval(interval);
        }, [onComplete]);

        return (
          <Card
            title="Running Analysis"
            description="ASTRA is comparing candidate data against the configured model."
          >
            <div className="space-y-4">
              <p className="text-sm text-slate-600">Analyzing candidates… please keep this tab open.</p>
              <div className="h-3 w-full overflow-hidden rounded-full bg-slate-200">
                <div
                  className="h-full rounded-full bg-blue-500 transition-all"
                  style={{ width: `${progress}%` }}
                ></div>
              </div>
              <div className="flex items-center justify-between text-xs text-slate-500">
                <span>Syncing Employment Hero candidates</span>
                <span>{progress}%</span>
              </div>
              <div className="grid gap-3 text-xs text-slate-500 md:grid-cols-2">
                <div className="rounded-xl bg-slate-50 p-3">
                  <p className="font-semibold text-slate-600">Steps</p>
                  <ul className="mt-1 space-y-1">
                    <li>• Parsing CVs for skills & tenure</li>
                    <li>• Extracting systems/tools mentions</li>
                    <li>• Applying bias adjustments</li>
                    <li>• Generating shortlist report</li>
                  </ul>
                </div>
                <div className="rounded-xl bg-slate-50 p-3">
                  <p className="font-semibold text-slate-600">Audit Trail</p>
                  <p className="mt-1">Run started: {new Date().toLocaleString()}</p>
                  <p>Initiated by: {"emma.carter@hpg.com.au"}</p>
                </div>
              </div>
            </div>
          </Card>
        );
      };

      const CandidateRow = ({ candidate }) => {
        const [expanded, setExpanded] = useState(false);

        return (
          <div className="rounded-2xl border border-slate-200 bg-white p-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <span className="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-500">

                  <p className="text-lg font-medium text-slate-900">{candidate.name}</p>
                  {candidate.flags?.map((flag) => (
                    <span
                      key={flag}
                      className={`rounded-full px-2.5 py-1 text-xs font-semibold ${
                        flag.includes("New")

                      {flag}
                    </span>

                </div>
                <div className="mt-1 flex flex-wrap items-center gap-4 text-xs text-slate-500">
                  <span>Location: {candidate.location}</span>
                  <span>Working Rights: {candidate.workingRights}</span>
                  <span>Salary: {candidate.salary}</span>
                  <span>Systems: {candidate.systems.join(", ")}</span>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <button className="rounded-xl border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-600">
                  Export Profile
                </button>
                <button
                  className="rounded-xl border border-slate-200 px-3 py-1 text-xs font-semibold text-blue-600"
                  onClick={() => setExpanded(!expanded)}
                >
                  {expanded ? "Hide" : "Expand"}
                </button>
              </div>
            </div>
            {expanded && (
              <div className="mt-4 grid gap-4 md:grid-cols-3">
                <div className="rounded-xl bg-slate-50 p-4 text-sm text-slate-600">
                  <p className="text-xs uppercase tracking-wide text-slate-400">ASTRA Summary</p>
                  <p className="mt-2">{candidate.summary}</p>
                </div>
                <div className="rounded-xl bg-slate-50 p-4 text-sm text-slate-600">
                  <p className="text-xs uppercase tracking-wide text-slate-400">Extracted Systems & Tools</p>
                  <p className="mt-2">{candidate.insights.tools}</p>
                  <p className="mt-4 text-xs text-slate-500">Cover letter insight:</p>
                  <p className="text-sm">{candidate.insights.coverLetter}</p>
                </div>
                <div className="rounded-xl bg-slate-50 p-4 text-sm text-slate-600">
                  <p className="text-xs uppercase tracking-wide text-slate-400">Score Breakdown</p>
                  <ul className="mt-2 space-y-1 text-sm">
                    {candidate.insights.biasBreakdown.map((item, index) => (
                      <li key={index}>• {item}</li>
                    ))}
                  </ul>
                  <p className="mt-4 text-xs text-slate-400">Run timestamp: {new Date().toLocaleString()}</p>
                </div>
              </div>
            )}
          </div>
        );
      };

      const ResultsStep = ({ analysis, filters, onFiltersChange, onBackToDashboard }) => {
        const candidates = analysis.shortlist.candidates;
        const filtered = candidates.filter((candidate) => {
          const locationMatch = filters.location === "All" || candidate.location === filters.location;
          const rightsMatch =
            filters.workingRights === "All" || candidate.workingRights === filters.workingRights;
          const statusMatch = filters.status === "All" || candidate.status === filters.status;
          return locationMatch && rightsMatch && statusMatch;
        });

        return (
          <div className="mx-auto flex min-h-screen max-w-6xl flex-col gap-8 px-6 py-12">
            <header className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <p className="text-sm uppercase tracking-wide text-slate-500">Shortlist ready</p>
                <h1 className="text-3xl font-semibold text-slate-900">{analysis.role}</h1>
                <p className="text-sm text-slate-500">Vacancy {analysis.id} · Run {analysis.shortlist.runAt}</p>
              </div>
              <button
                className="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100"
                onClick={onBackToDashboard}
              >
                Back to Dashboard
              </button>
            </header>

            <Card
              title="Shortlist Overview"
              description="Filter candidates and review AI insights before export."
              actions={
                <div className="flex flex-wrap items-center gap-2">
                  <button className="rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600">
                    Export CSV
                  </button>
                  <button className="rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600">
                    Export PDF (Top 10)
                  </button>
                  <button className="rounded-xl bg-blue-500 px-3 py-2 text-xs font-semibold text-white">
                    Rerun Analysis
                  </button>
                </div>
              }
            >
              <div className="flex flex-wrap items-center gap-3">
                <select
                  className="rounded-xl border border-slate-200 px-3 py-2 text-xs"
                  value={filters.location}
                  onChange={(event) => onFiltersChange({ ...filters, location: event.target.value })}
                >
                  {allFilters.location.map((option) => (
                    <option key={option}>{option}</option>
                  ))}
                </select>
                <select
                  className="rounded-xl border border-slate-200 px-3 py-2 text-xs"
                  value={filters.workingRights}
                  onChange={(event) => onFiltersChange({ ...filters, workingRights: event.target.value })}
                >
                  {allFilters.workingRights.map((option) => (
                    <option key={option}>{option}</option>
                  ))}
                </select>
                <select
                  className="rounded-xl border border-slate-200 px-3 py-2 text-xs"
                  value={filters.status}
                  onChange={(event) => onFiltersChange({ ...filters, status: event.target.value })}
                >
                  {allFilters.status.map((option) => (
                    <option key={option}>{option}</option>
                  ))}
                </select>
                <span className="text-xs text-slate-500">{filtered.length} candidates shown</span>

              <div className="space-y-4">
                {filtered.map((candidate) => (
                  <CandidateRow key={candidate.id} candidate={candidate} />
                ))}
              </div>
            </Card>
            <Card title="Audit Trail" description="Trace configuration used for this run.">
              <div className="grid gap-4 md:grid-cols-3">
                <div>
                  <p className="text-xs uppercase tracking-wide text-slate-400">Weights</p>
                  <ul className="mt-2 space-y-1 text-xs">
                    {analysis.weights.map((weight, index) => (
                      <li key={index}>• {weight.label}: {weight.value}%</li>
                    ))}
                  </ul>

                <div>
                  <p className="text-xs uppercase tracking-wide text-slate-400">Biases</p>
                  <ul className="mt-2 space-y-1 text-xs">
                    {analysis.biases.map((bias, index) => (
                      <li key={index}>• {bias.label}</li>
                    ))}
                  </ul>
                </div>
                <div>
                  <p className="text-xs uppercase tracking-wide text-slate-400">Evaluation Questions</p>
                  <ul className="mt-2 space-y-1 text-xs">
                    {analysis.questions.slice(0, 4).map((question, index) => (
                      <li key={index}>• {question}</li>
                    ))}
                    {analysis.questions.length > 4 && <li>• …</li>}
                  </ul>
                </div>
              </div>
            </Card>
          </div>
        );

      const AnalysisWizard = ({ user, templateOptions, onCancel, onComplete }) => {
        const role = user.role;
        const [step, setStep] = useState(0);
        const [formData, setFormData] = useState({});
        const [showProgress, setShowProgress] = useState(false);
        const selectedTemplate =
          templateOptions.find((item) => item.id === formData.jobDescription?.templateId) ||
          templateOptions[0];

        const handleComplete = () => {
          setShowProgress(false);
          const template =
            templateOptions.find((item) => item.id === formData.jobDescription?.templateId) ||
            templateOptions[0];
          const newAnalysis = {
            id: formData.vacancy?.vacancyId || "EH-12345",
            role: template.name,
            businessUnit: template.businessUnit || "Park Operations",
            roleType: template.roleType || "Front of House",
            owner: user.email,
            date: new Date().toLocaleDateString(),
            status: "Complete",
            version: 1,
            roleTemplate: template.name,
            questions: formData.questions?.questions || template.defaultQuestions || [],
            weights:
              role === "HRBP"
                ? formData.weights?.weights || template.defaultWeights
                : template.defaultWeights,
            biases:
              role === "HRBP"
                ? (formData.weights?.biases || template.defaultBiases || []).map((item) =>
                    typeof item === "string" ? { label: item } : item
                  )
                : (template.defaultBiases || []).map((item) =>
                    typeof item === "string" ? { label: item } : item
                  ),
            shortlist: mockAnalyses[0].shortlist,
          };
          onComplete(newAnalysis);
        };

        const renderStep = () => {
          if (showProgress) {
            return <AnalysisProgress onComplete={handleComplete} />;
          }

          switch (step) {
            case 0:
              return (
                <VacancyStep
                  value={formData.vacancy || {}}
                  onChange={(value) => setFormData({ ...formData, vacancy: value })}
                  onNext={() => setStep(1)}
                />
              );
            case 1:
              return (
                <JobDescriptionStep
                  value={formData.jobDescription || {}}
                  onChange={(value) => setFormData({ ...formData, jobDescription: value })}
                  onNext={() => setStep(2)}
                  templates={templateOptions}
                  role={role}
                />
              );
            case 2:
              return (
                <QuestionsStep
                  value={formData.questions || {}}
                  onChange={(value) => setFormData({ ...formData, questions: value })}
                  onNext={() => setStep(3)}
                  template={selectedTemplate}
                  role={role}
                />
              );
            case 3:
              return (
                <WeightsBiasesStep
                  role={role}
                  value={formData.weights || {}}
                  onChange={(value) => setFormData({ ...formData, weights: value })}
                  onNext={() => setStep(4)}
                  template={selectedTemplate}
                />
              );
            case 4:
              return (
                <Card
                  title="Review & Run Analysis"
                  description="Confirm configuration before executing the shortlist."
                  actions={
                    <button
                      className="rounded-xl bg-blue-500 px-4 py-2 text-sm font-semibold text-white"
                      onClick={() => setShowProgress(true)}
                    >
                      Run Analysis
                    </button>
                  }
                >
                  <div className="grid gap-4 md:grid-cols-2">
                    <div className="rounded-2xl bg-slate-50 p-4 text-sm text-slate-600">
                      <p className="text-xs uppercase tracking-wide text-slate-400">Vacancy</p>
                      <p className="mt-1 font-semibold text-slate-700">
                        {formData.vacancy?.vacancyId || "EH-12345"}
                      </p>
                      <p className="text-xs text-slate-500">
                        Linked: {(formData.vacancy?.linkedVacancies || []).join(", ")}
                      </p>
                    </div>
                    <div className="rounded-2xl bg-slate-50 p-4 text-sm text-slate-600">
                      <p className="text-xs uppercase tracking-wide text-slate-400">Job Description</p>
                      <p className="mt-1 font-semibold text-slate-700">
                        {formData.jobDescription?.template || formData.jobDescription?.filename}
                      </p>
                      <p className="text-xs text-slate-500">Stored version for audit trail.</p>
                    </div>
                    <div className="rounded-2xl bg-slate-50 p-4 text-sm text-slate-600">
                      <p className="text-xs uppercase tracking-wide text-slate-400">Questions</p>
                      <p className="mt-1 text-xs text-slate-500">
                        {formData.questions?.questions?.length || 0} active questions
                      </p>
                    </div>
                    <div className="rounded-2xl bg-slate-50 p-4 text-sm text-slate-600">
                      <p className="text-xs uppercase tracking-wide text-slate-400">Weights & Biases</p>
                      <p className="mt-1 text-xs text-slate-500">
                        Weights: {formData.weights?.weights?.map((item) => item.label).join(", ") || "Default"}
                      </p>
                      <p className="text-xs text-slate-500">
                        Biases: {formData.weights?.biases?.length || 0}
                      </p>
                    </div>
                  </div>
                </Card>
              );
            default:
              return null;
          }
        };

        return (
          <div className="mx-auto flex min-h-screen max-w-5xl flex-col gap-6 px-6 py-10">
            <header className="flex items-center justify-between">
              <h1 className="text-2xl font-semibold text-slate-900">New Analysis</h1>
              <button className="text-sm font-semibold text-slate-500" onClick={onCancel}>
                Cancel
              </button>
            </header>
            <div className="flex flex-wrap items-center gap-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200">
              {progressSteps.map((label, index) => (
                <StepPill key={label} label={label} index={index} current={step} />
              ))}
            </div>
            {renderStep()}
          </div>
        );
      };

      const App = () => {
        const [user, setUser] = useState(null);
        const [analyses, setAnalyses] = useState(mockAnalyses);
        const [view, setView] = useState("login");
        const [selectedAnalysis, setSelectedAnalysis] = useState(null);
        const [dashboardFilters, setDashboardFilters] = useState({
          query: "",
          businessUnit: "All",
          roleType: "All",
        });
        const [shortlistFilters, setShortlistFilters] = useState({
          location: "All",
          workingRights: "All",
          status: "All",
        });

        const handleLogin = (details) => {
          setUser(details);
          setView("dashboard");
        };

        const handleCreate = () => {
          setView("wizard");
        };

        const handleCompleteAnalysis = (analysis) => {
          setAnalyses((prev) => [analysis, ...prev]);
          setSelectedAnalysis(analysis);
          setView("results");
        };

        const handleSelectAnalysis = (analysis) => {
          setSelectedAnalysis(analysis);
          setShortlistFilters({ location: "All", workingRights: "All", status: "All" });
          setView("results");
        };

        const handleLogout = () => {
          setUser(null);
          setView("login");
        };

        if (view === "login" || !user) {
          return <LoginScreen onLogin={handleLogin} />;
        }

        if (view === "wizard") {
          return (
            <AnalysisWizard
              user={user}
              templateOptions={roleTemplates[user.role] || roleTemplates.HRBP}
              onCancel={() => setView("dashboard")}
              onComplete={handleCompleteAnalysis}
            />
          );
        }

        if (view === "results" && selectedAnalysis) {
          return (
            <ResultsStep
              analysis={selectedAnalysis}
              filters={shortlistFilters}
              onFiltersChange={setShortlistFilters}
              onBackToDashboard={() => setView("dashboard")}
            />
          );
        }

        return (
          <Dashboard
            role={user.role}
            email={user.email}
            analyses={analyses}
            onCreate={handleCreate}
            onSelect={handleSelectAnalysis}
            filters={dashboardFilters}
            onFiltersChange={setDashboardFilters}
            onLogout={handleLogout}
          />
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
